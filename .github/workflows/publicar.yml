name: Publicar y Actualizar Datos

on:
  schedule:
    - cron: "0 */4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Actualizar datos literarios
        run: node herramientas/actualizar-semana.js
        continue-on-error: true

      - name: Actualizar versión en index.html
        run: |
          VERSION=$(date -u +"%Y.%m.%d-%H%M")
          sed -i "s/__VERSION__/${VERSION}/g" public/index.html
          echo "Versión: ${VERSION}"

      - name: Confirmar cambios de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/datos/*.json public/index.html
          git diff --cached --quiet || git commit -m "datos: actualizar JSON literarios $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  publicar-pages:
    needs: actualizar-datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
